<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Founders' House</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to Founders' House." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
  <style>
    :root {
      --navy: #0B1B3A;
      --saffron: #FF7A1A;
      --off-white: #FAF6EF;
      --gold: #F2B84B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      color: var(--off-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Background decoration */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: var(--saffron);
      border-radius: 50%;
      filter: blur(160px);
      opacity: 0.1;
      top: -15%;
      right: -10%;
    }

    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--saffron), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.6);
      max-width: 480px;
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      padding: 1rem 2.5rem;
      border-radius: 60px;
      background: var(--saffron);
      color: white;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(255, 122, 26, 0.25);
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn:hover {
      background: #e86a0e;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(255, 122, 26, 0.3);
    }

    .links {
      margin-top: 2rem;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .links a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .links a:hover {
      color: var(--saffron);
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1>This page doesn't exist</h1>
  <p>Looks like you've wandered off the sprint track. The page you're looking for might have been moved or doesn't exist.</p>

  <a href="/" class="btn">Back to Home →</a>

  <div class="links">
    <a href="/#about">About</a>
    <a href="/#tracks">Tracks</a>
    <a href="/#apply">Apply</a>
    <a href="/#faq">FAQ</a>
    <a href="mailto:official.hultprize.tiu@gmail.com">Contact</a>
  </div>
</body>
</html>
