<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Founders' House | Kolkata's Premier 72 Hour Residential Startup Hackathon</title>
    <meta name="description" content="Kolkata's ultimate 72 hour residential startup hackathon at AIC Techno. 18 to 20 Dec 2026. Ship real products, meet top investors, win ₹50L+ in incubation and prizes." />
    
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Founders' House | Kolkata's Premier 72 Hour Startup Hackathon" />
    <meta property="og:description" content="From Idea to Investment in Three Days. 18 to 20 Dec 2026, Kolkata. Top 10 student teams selected. Free to apply." />
    
    <!-- Preload Critical Above-the-Fold Fonts and Responsive Hero Background Images -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/bebasneue/v16/JTUSjIg69CK48gW7PXoo9Wlhyw.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/poppins/v24/pxiEyp8kv8JHgFVrJJfecg.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLEj6Z1xlFQ.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/howrah_bridge_mobile.webp" type="image/webp" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/howrah_bridge_bg.webp" type="image/webp" media="(min-width: 769px)" />
  </head>
  <body class="bg-[#0A0A0A] text-[#FFF9F2] selection:bg-[#E11D48] selection:text-[#FFFFFF]">
    <!-- Static Devfolio verification fallback for automated web crawlers -->
    <noscript>
      <div 
        class="apply-button" 
        data-hackathon-slug="founders-house-kolkata" 
        data-button-theme="light"
        style="height: 44px; width: 312px"
      ></div>
      <section id="sponsors-noscript" class="sponsors">
        <a href="https://devfolio.co" target="_blank" rel="noopener noreferrer">
          <img src="/devfolio_logo.png" alt="DEVFOLIO LOGO" />
        </a>
      </section>
    </noscript>

    <!-- Devfolio automated bot verification container (off-screen so it never flashes to users on reload) -->
    <div 
      style="position: absolute; width: 1px; height: 1px; left: -9999px; top: -9999px; overflow: hidden; pointer-events: none;"
      aria-hidden="true"
    >
      <div 
        class="apply-button" 
        data-hackathon-slug="founders-house-kolkata" 
        data-button-theme="light"
        style="height: 44px; width: 312px"
      ></div>
      <section id="sponsors-crawler" class="sponsors">
        <a href="https://devfolio.co" target="_blank" rel="noopener noreferrer">
          <img src="/devfolio_logo.png" alt="DEVFOLIO LOGO" />
        </a>
      </section>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Devfolio SDK -->
    <script defer async src="https://apply.devfolio.co/v2/sdk.js"></script>
  </body>
</html>
